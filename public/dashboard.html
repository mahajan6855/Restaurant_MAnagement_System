
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header><h1>Restaurant Admin Dashboard</h1></header>

<nav>
    <a href="index.html">Website</a>
    <a href="orders.html">Orders</a>
    <a href="#" onclick="logout()">Logout</a>
</nav>

<section>
    <h2>Add Food Item</h2>

    <form id="foodForm">

        <input id="foodName" placeholder="Food Name" required>

        <input id="foodPrice" type="number"
               min="0" step="0.01"
               placeholder="Price" required>

        <input id="categoryId" type="number"
               min="1" placeholder="Category ID" required>

        <input id="foodDescription"
               placeholder="Food Description">

        <button type="submit">Add Food</button>
    </form>

    <p id="message"></p>
</section>

<section>
    <h2>Manage Orders</h2>
    <div id="orders-list"></div>
</section>

<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
